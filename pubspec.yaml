name: dscript_dart
description: Scripting language for flutter/dart plugins & extensions
version: 1.2.0
repository: https://github.com/mcquenji/dscript

environment:
  sdk: ^3.5.4

dependencies:
  antlr4: ^4.13.2
  collection: ^1.19.1
  dio: ^5.8.0+1
  dscript_annotations: ^1.0.0
  equatable: ^2.0.7
  logging: ^1.3.0
  meta: ^1.17.0
  pub_semver: ^2.2.0
  result_dart: ^2.1.0

dev_dependencies:
  build_runner: ^2.4.11
  custom_lint: ^0.8.0
  custom_lints:
    path: ./custom_lints
  dscript_gen: ^1.1.1
  lints: ^5.0.0
  test: ^1.24.0
